server:
  address: tcp://:9091/
log:
  level: info
authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml
access_control:
  default_policy: deny
  rules:
    - domain:
        - '${MEDIA_DOMAIN}'
        - '*.${MEDIA_DOMAIN}'
      policy: one_factor
      subject: 'group:admins'
session:
  name: media_session
  same_site: lax
  inactivity: 1h
  expiration: 12h
  remember_me: 30d
  cookies:
    - domain: '${MEDIA_DOMAIN}'
      authelia_url: 'https://auth.${MEDIA_DOMAIN}'
      default_redirection_url: 'https://${MEDIA_DOMAIN}'
  redis:
    host: redis
    port: 6379
storage:
  local:
    path: /config/db.sqlite3
notifier:
  filesystem:
    filename: /config/notification.txt
regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 15m

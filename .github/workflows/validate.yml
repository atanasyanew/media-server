name: Validate media stack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/backup.sh scripts/vpn-check.sh
      - name: Generate non-secret validation configuration
        run: python tests/prepare_validation.py
      - run: docker compose config --quiet
      - run: docker compose run --rm --no-deps authelia authelia config validate --config /config/configuration.yml
      - run: docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker compose build portal
      - name: Verify unauthenticated requests cannot forge a login
        run: |
          docker compose up -d --wait redis authelia portal caddy
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt ./ci-root.crt
          status=$(curl --silent --show-error --fail --retry 10 --retry-connrefused --retry-delay 1 --max-time 10 --resolve media.home.arpa:443:127.0.0.1 --cacert ci-root.crt --header 'Remote-User: forged' --dump-header ci-auth-headers --output ci-auth-body --write-out '%{http_code}' https://media.home.arpa/)
          test "$status" = 302
          grep -qi '^location: https://auth.media.home.arpa' ci-auth-headers
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: browser-*.png
          if-no-files-found: ignore
      - run: docker compose down
        if: always()
